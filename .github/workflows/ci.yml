# CI：两层，分开跑，失败信息指向明确。
#
#   static  无依赖：单元测试 + 静态自检（不启浏览器）。几十秒内出结果。
#   browser 要 Chrome + ffmpeg：无头渲染的全部验证。
#
# 分开的理由：static 挂掉基本就是代码错了（引用、导出、纯函数行为）；
# browser 挂掉更可能是渲染行为变了。混在一个 job 里看不出是哪一类。
#
# 关于像素回归：基准（examples/minimal/regression-baseline.json）是在
# **抓基准的那台机器**上 capture 的，字体栅格化随操作系统/浏览器版本变，
# 跨 OS 逐字节比对必然红。所以：
#   - 本机（抓基准的同一类环境）：capture → 改结构 → verify，逐字节全同才算重构；
#   - CI（无头 Ubuntu）：同一运行内 capture → verify，自证「两轮渲染逐字节相同」。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: 静态（无依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # engines 要求 >=22：驱动浏览器用全局 WebSocket，Node 20 上没有。
          node-version: '22'

      # 核心命令零依赖；只有 MCP 测试需要 @modelcontextprotocol/sdk。
      # 装依赖让 tests/mcp.test.mjs 不被跳过（没装时它会优雅 skip）。
      - name: 安装依赖（仅 MCP 测试需要）
        run: npm ci

      - name: 单元测试（含 MCP 端到端）
        run: npm test

      - name: 静态自检（不启浏览器）
        run: node bin/filmwright.mjs check --project examples/minimal --static-only

  browser:
    name: 渲染（无头 Chrome + ffmpeg）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ubuntu-latest 不自带 ffmpeg（实测 render 一步 spawn ffmpeg ENOENT）；
      # 且 `ffmpeg -version | head -1` 这种写法在命令缺失时也会绿 —— 管道退出码
      # 取的是 head 的 0。所以：先显式安装，再用 command -v 硬断言。
      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 确认环境（Chrome / ffmpeg，缺失即失败）
        run: |
          set -e
          google-chrome --version || chromium --version
          command -v ffmpeg >/dev/null || { echo 'ffmpeg 不在 PATH'; exit 1; }
          command -v ffprobe >/dev/null || { echo 'ffprobe 不在 PATH'; exit 1; }
          ffmpeg -version | head -1

      - name: 逐帧 + 画质自检
        run: node bin/filmwright.mjs check --project examples/minimal

      - name: 渲染确定性（同运行内 capture → verify，两轮渲染逐字节相同）
        run: |
          node tools/regression.mjs capture --project examples/minimal
          node tools/regression.mjs verify --project examples/minimal

      - name: 负面对照（证明画质检查真的会报）
        run: node tools/quality-negative.mjs

      - name: 素材（加载就绪 / 真画出来 / 引错名字要报）
        run: node tools/verify-assets.mjs

      - name: 预览页（拖动 / 播放 / 热重载）
        run: node tools/verify-preview.mjs

      - name: 端到端出片
        run: node bin/filmwright.mjs render --project examples/minimal --shards 2

      - name: 产物大小（防止渲染出空文件）
        run: |
          f=$(ls examples/minimal/.work/*.mp4 | head -1)
          test -s "$f" || { echo "渲染产物为空"; exit 1; }
          ls -la "$f"
