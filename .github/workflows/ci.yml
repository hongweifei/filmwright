# CI：两层 × 平台矩阵，失败信息指向明确。
#
#   static  无依赖：单元测试 + 静态自检（不启浏览器）。三个 OS 全跑 ——
#           核心零依赖，这是「跨平台」最便宜也最真的证据。
#   browser 要 Chrome/Edge + ffmpeg：无头渲染验证。跑 ubuntu 与 windows：
#           ubuntu 是 CI 主战场；windows 用预装 Edge（findBrowser 认识它）。
#           macOS 只进 static —— 渲染层在 macOS 上没有本地实测证据，
#           与其配一条猜出来的 job，不如等真机验证过再进矩阵（见 LIMITATIONS）。
#
# 像素回归的边界：基准是**本机夹具**（字体栅格化随 OS/版本变），
# 所以 CI 里做的是「同一次运行内 capture → verify」的确定性自证，
# 跨 OS 的基准比对不做。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: 静态（无依赖）· ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # engines 要求 >=22：驱动浏览器要用全局 WebSocket，Node 20 上没有。
          node-version: '22'

      # 核心命令零依赖；只有 MCP 测试需要 @modelcontextprotocol/sdk。
      # 装依赖让 tests/mcp.test.mjs 不被跳过（没装时它会优雅 skip）。
      - name: 安装依赖（仅 MCP 测试需要）
        run: npm ci

      - name: 单元测试（含 MCP 端到端）
        run: npm test

      - name: 静态自检（不启浏览器）
        run: node bin/filmwright.mjs check --project examples/minimal --static-only

  browser:
    name: 渲染（无头浏览器 + ffmpeg）· ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ubuntu-latest 不自带 ffmpeg（实测 ENOENT）；windows 用 choco 补。
      - name: 安装 ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 安装 ffmpeg（choco）
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      # 真断言：findBrowser() 是渲染实际走的那条查找路径，它抛错才算缺；
      # pipefail 让 `ffmpeg -version | head` 不再假绿（管道退出码取 head 的 0）。
      - name: 确认环境（浏览器 / ffmpeg，缺失即失败）
        run: |
          set -euo pipefail
          node -e "import('./src/host/browser/find.mjs').then((m) => console.log('浏览器：' + m.findBrowser()))"
          command -v ffmpeg >/dev/null || { echo 'ffmpeg 不在 PATH'; exit 1; }
          command -v ffprobe >/dev/null || { echo 'ffprobe 不在 PATH'; exit 1; }
          ffmpeg -version | head -1

      - name: 逐帧 + 画质自检
        run: node bin/filmwright.mjs check --project examples/minimal

      # 画质/逐帧是「阈值型 + 浏览器型」检查：读数贴阈值或 runner 资源紧张时
      # 会随机翻面（实测 windows runner 上不同步骤轮流挂，代码未变）。
      # 失败时把**所有失败检查**的完整读数打出来，而不是只猜 quality。
      #
      # 这一步**必须永不失败**（continue-on-error + 处处 || true）：诊断脚本自己挂掉
      # 会把真正的失败信息一起埋掉（实测发生过一次）。
      #
      # 同时用 `::error::` 输出关键读数 —— 它会变成 **annotation**，而 annotation
      # 在未登录时也能通过 API 读到（job 日志正文不行：公开仓库的 logs API 会
      # 重定向到登录页）。这是把 CI 内部信息取出来的唯一通道。
      - name: 失败现场（仅失败时跑）
        if: failure()
        continue-on-error: true
        run: |
          node bin/filmwright.mjs check --project examples/minimal --json > ci-check.json 2>&1 || true
          node -e "
          const fs = require('node:fs');
          const emit = (s) => console.log('::error::' + String(s).replace(/\r?\n/g, ' ⏎ ').slice(0, 800));
          let j = null;
          try { j = JSON.parse(fs.readFileSync('ci-check.json','utf8')); } catch (e) {
            emit('拿不到 JSON（check 可能本身崩了）。原始输出：' + fs.readFileSync('ci-check.json','utf8').slice(0, 600));
          }
          if (j) {
            emit('summary: ok=' + j.ok + ' errors=' + (j.errors||[]).length);
            for (const e of j.errors||[]) emit('ERROR ' + e.code + ' ' + e.message);
            for (const c of (j.data && j.data.checks) || []) {
              const head = (c.ok ? 'OK ' : 'FAIL ') + c.name + ' checked=' + c.checked;
              const probs = (c.problems||[]).join(' | ');
              const stats = (c.stats||[]).map((s) => s.id + ':静止' + s.longestStatic + ',墨迹' + (s.inkMin*100).toFixed(2) + '%,末拍' + (s.hold===null?'-':s.hold) + '/' + s.holdSource).join(' | ');
              emit(head + (probs ? ' >> ' + probs : '') + (stats ? ' >> ' + stats : ''));
            }
            emit('阈值: staticFrames 90 / holdFrames 30 / inkMin 0.40%');
          }
          " || true
          echo '--- .work 产物 ---'
          node -e "const {readdirSync,statSync}=require('node:fs');const d='examples/minimal/.work';try{for(const f of readdirSync(d)){const s=statSync(d+'/'+f);console.log(' ',f,s.isDirectory()?'<dir>':s.size)}}catch(e){console.log(' 读不到',e.message)}" || true
          echo '--- parts ---'
          node -e "const {readdirSync,statSync}=require('node:fs');const d='examples/minimal/.work/parts';try{for(const f of readdirSync(d))console.log(' ',f,statSync(d+'/'+f).size)}catch(e){console.log(' 读不到',e.message)}" || true
          echo '--- node/ffmpeg ---'
          node --version || true
          ffmpeg -version 2>&1 | head -1 || true

      - name: 场景规格示例（纯 scene 项目）
        run: |
          node bin/filmwright.mjs check --project examples/scenecast --static-only
          node bin/filmwright.mjs check --project examples/gallery --static-only

      - name: 渲染确定性（同运行内 capture → verify，两轮渲染逐字节相同）
        run: |
          node tools/regression.mjs capture --project examples/minimal
          node tools/regression.mjs verify --project examples/minimal

      - name: 负面对照（证明画质检查真的会报）
        run: node tools/quality-negative.mjs

      - name: 素材（加载就绪 / 真画出来 / 引错名字要报）
        run: node tools/verify-assets.mjs

      - name: 预览页（拖动 / 播放 / 热重载）
        run: node tools/verify-preview.mjs

      - name: 端到端出片
        run: node bin/filmwright.mjs render --project examples/minimal --shards 2

      # 用 node 取产物、判非空，不用 `ls | head -1`：
      # Git Bash 的 ls 是多列输出，`head -1` 会截出多个文件名的片段，
      # test -s 拿到一个不存在的路径就失败（windows job 实测挂在这一步）。
      # 顺带用 ffprobe 验帧数，比「文件非空」更硬。
      - name: 产物检查（非空 + 帧数对得上）
        run: |
          node -e "
          const {readdirSync, statSync} = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const dir = 'examples/minimal/.work';
          const mp4 = readdirSync(dir).filter((f) => f.endsWith('.mp4'));
          if (mp4.length === 0) { console.error('渲染产物为空：' + dir + ' 下没有 mp4'); process.exit(1); }
          const f = dir + '/' + mp4[0];
          const size = statSync(f).size;
          if (size <= 0) { console.error('产物是空文件：' + f); process.exit(1); }
          const want = JSON.parse(require('node:fs').readFileSync('examples/minimal/script/timeline.json','utf8')).total_frames;
          const got = Number(execFileSync('ffprobe', ['-v','error','-count_frames','-select_streams','v:0',
            '-show_entries','stream=nb_read_frames','-of','csv=p=0', f], {encoding:'utf8'}).trim());
          console.log(f, size, 'bytes,', got, 'frames');
          if (got !== want) { console.error('帧数不对：产物 ' + got + '，时间轴 ' + want); process.exit(1); }
          "
