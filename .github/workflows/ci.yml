# CI：两层 × 平台矩阵，失败信息指向明确。
#
#   static  无依赖：单元测试 + 静态自检（不启浏览器）。三个 OS 全跑 ——
#           核心零依赖，这是「跨平台」最便宜也最真的证据。
#   browser 要 Chrome/Edge + ffmpeg：无头渲染验证。跑 ubuntu 与 windows：
#           ubuntu 是 CI 主战场；windows 用预装 Edge（findBrowser 认识它）。
#           macOS 只进 static —— 渲染层在 macOS 上没有本地实测证据，
#           与其配一条猜出来的 job，不如等真机验证过再进矩阵（见 LIMITATIONS）。
#
# 像素回归的边界：基准是**本机夹具**（字体栅格化随 OS/版本变），
# 所以 CI 里做的是「同一次运行内 capture → verify」的确定性自证，
# 跨 OS 的基准比对不做。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: 静态（无依赖）· ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # engines 要求 >=22：驱动浏览器要用全局 WebSocket，Node 20 上没有。
          node-version: '22'

      # 核心命令零依赖；只有 MCP 测试需要 @modelcontextprotocol/sdk。
      # 装依赖让 tests/mcp.test.mjs 不被跳过（没装时它会优雅 skip）。
      - name: 安装依赖（仅 MCP 测试需要）
        run: npm ci

      - name: 单元测试（含 MCP 端到端）
        run: npm test

      - name: 静态自检（不启浏览器）
        run: node bin/filmwright.mjs check --project examples/minimal --static-only

  browser:
    name: 渲染（无头浏览器 + ffmpeg）· ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ubuntu-latest 不自带 ffmpeg（实测 ENOENT）；windows 用 choco 补。
      - name: 安装 ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 安装 ffmpeg（choco）
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      # 真断言：findBrowser() 是渲染实际走的那条查找路径，它抛错才算缺；
      # pipefail 让 `ffmpeg -version | head` 不再假绿（管道退出码取 head 的 0）。
      - name: 确认环境（浏览器 / ffmpeg，缺失即失败）
        run: |
          set -euo pipefail
          node -e "import('./src/host/browser/find.mjs').then((m) => console.log('浏览器：' + m.findBrowser()))"
          command -v ffmpeg >/dev/null || { echo 'ffmpeg 不在 PATH'; exit 1; }
          command -v ffprobe >/dev/null || { echo 'ffprobe 不在 PATH'; exit 1; }
          ffmpeg -version | head -1

      - name: 逐帧 + 画质自检
        run: node bin/filmwright.mjs check --project examples/minimal

      - name: 场景规格示例（纯 scene 项目）
        run: |
          node bin/filmwright.mjs check --project examples/scenecast --static-only
          node bin/filmwright.mjs check --project examples/gallery --static-only

      - name: 渲染确定性（同运行内 capture → verify，两轮渲染逐字节相同）
        run: |
          node tools/regression.mjs capture --project examples/minimal
          node tools/regression.mjs verify --project examples/minimal

      - name: 负面对照（证明画质检查真的会报）
        run: node tools/quality-negative.mjs

      - name: 素材（加载就绪 / 真画出来 / 引错名字要报）
        run: node tools/verify-assets.mjs

      - name: 预览页（拖动 / 播放 / 热重载）
        run: node tools/verify-preview.mjs

      - name: 端到端出片
        run: node bin/filmwright.mjs render --project examples/minimal --shards 2

      - name: 产物大小（防止渲染出空文件）
        run: |
          set -euo pipefail
          f=$(ls examples/minimal/.work/*.mp4 | head -1)
          test -s "$f" || { echo "渲染产物为空"; exit 1; }
          ls -la "$f"
