# CI：两层 × 平台矩阵，失败信息指向明确。
#
#   static  无依赖：单元测试 + 静态自检（不启浏览器）。三个 OS 全跑 ——
#           核心零依赖，这是「跨平台」最便宜也最真的证据。
#   browser 要 Chrome/Edge + ffmpeg：无头渲染验证。跑 ubuntu 与 windows：
#           ubuntu 是 CI 主战场；windows 用预装 Edge（findBrowser 认识它）。
#           macOS 只进 static —— 渲染层在 macOS 上没有本地实测证据，
#           与其配一条猜出来的 job，不如等真机验证过再进矩阵（见 LIMITATIONS）。
#
# 像素回归的边界：基准是**本机夹具**（字体栅格化随 OS/版本变），
# 所以 CI 里做的是「同一次运行内 capture → verify」的确定性自证，
# 跨 OS 的基准比对不做。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: 静态（无依赖）· ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # engines 要求 >=22：驱动浏览器要用全局 WebSocket，Node 20 上没有。
          node-version: '22'

      # 核心命令零依赖；只有 MCP 测试需要 @modelcontextprotocol/sdk。
      # 装依赖让 tests/mcp.test.mjs 不被跳过（没装时它会优雅 skip）。
      # 注意：这个 job **不跑重浏览器测试**（review/stills 要真渲染），
      # 那些在下面的 browser job 里跑（那里本来就有浏览器）。
      - name: 安装依赖（仅 MCP 测试需要）
        run: npm ci

      - name: 单元测试（协议层；重浏览器测试留给 browser job）
        run: npm test

      - name: 静态自检（不启浏览器）
        run: node bin/filmwright.mjs check --project examples/minimal --static-only

  browser:
    name: 渲染（无头浏览器 + ffmpeg）· ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖（MCP 重浏览器测试需要）
        run: npm ci

      # ubuntu-latest 不自带 ffmpeg（实测 ENOENT）；windows 用 choco 补。
      - name: 安装 ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 安装 ffmpeg（choco）
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      # 真断言：findBrowser() 是渲染实际走的那条查找路径，它抛错才算缺；
      # pipefail 让 `ffmpeg -version | head` 不再假绿（管道退出码取 head 的 0）。
      - name: 确认环境（浏览器 / ffmpeg，缺失即失败）
        run: |
          set -euo pipefail
          node -e "import('./src/host/browser/find.mjs').then((m) => console.log('浏览器：' + m.findBrowser()))"
          command -v ffmpeg >/dev/null || { echo 'ffmpeg 不在 PATH'; exit 1; }
          command -v ffprobe >/dev/null || { echo 'ffprobe 不在 PATH'; exit 1; }
          ffmpeg -version | head -1

      - name: 逐帧 + 画质自检
        run: node bin/filmwright.mjs check --project examples/minimal

      # 重浏览器测试（MCP 的 stills/review 要真渲染）：static job 里跳过、
      # 这里跑 —— 这个 job 本来就有浏览器与 ffmpeg。
      #
      # 显式用 bash：windows runner 的默认 shell 是 PowerShell，行为与 ubuntu 不同
      # （实测该步骤在 windows 上 0 秒失败、而本机同命令通过 —— 环境/shell 差异）。
      # 与 job 级 defaults 一致地走 bash，消除这一层变量；`set -x` 让命令可见。
      - name: MCP 重浏览器测试（stills / review 回图）
        shell: bash
        env:
          FILMWRIGHT_TEST_BROWSER: '1'
        run: |
          set -x
          node --version
          node --test tests/mcp.test.mjs

      # 画质/逐帧是「阈值型 + 浏览器型」检查：读数贴阈值或 runner 资源紧张时
      # 会随机翻面（实测 windows runner 上不同步骤轮流挂，代码未变）。
      - name: 场景规格示例（纯 scene 项目）
        run: |
          node bin/filmwright.mjs check --project examples/scenecast --static-only
          node bin/filmwright.mjs check --project examples/gallery --static-only

      # 渲染确定性：同一次运行内 capture → verify，证明「两轮渲染逐字节相同」。
      #
      # 基准写到**临时路径**：入库的 regression-baseline.json 是**本机夹具**
      # （字体栅格化随 OS/浏览器版本变），CI 覆盖它只会制造脏工作区，
      # 而且跨 OS 比对本来就不成立（见 docs/qc.md）。
      - name: 渲染确定性（同运行内 capture → verify，两轮渲染逐字节相同）
        run: |
          BASE=$(node -e "console.log(require('node:path').join(require('node:os').tmpdir(),'fw-regression-baseline.json'))")
          echo "基准：$BASE"
          node tools/regression.mjs capture --project examples/minimal --baseline "$BASE"
          node tools/regression.mjs verify  --project examples/minimal --baseline "$BASE"

      - name: 负面对照（证明画质检查真的会报）
        run: node tools/quality-negative.mjs

      - name: 素材（加载就绪 / 真画出来 / 引错名字要报）
        run: node tools/verify-assets.mjs

      - name: 预览页（拖动 / 播放 / 热重载）
        run: node tools/verify-preview.mjs

      # `--shards auto` 按核数定分片：windows runner 只有 2 核，硬写 2 片会超订
      # （2 个无头 Chrome + 2 个 ffmpeg 抢 2 核，实测端到端出片跑 109s 后失败）。
      # ubuntu runner 核多，自动会开更多片 —— 这正是 --shards auto 的用途。
      - name: 端到端出片
        run: node bin/filmwright.mjs render --project examples/minimal --shards auto

      # 用 node 取产物、判非空，不用 `ls | head -1`：
      # Git Bash 的 ls 是多列输出，`head -1` 会截出多个文件名的片段，
      # test -s 拿到一个不存在的路径就失败（windows job 实测挂在这一步）。
      # 顺带用 ffprobe 验帧数，比「文件非空」更硬。
      - name: 产物检查（非空 + 帧数对得上）
        run: |
          node -e "
          const {readdirSync, statSync} = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const dir = 'examples/minimal/.work';
          const mp4 = readdirSync(dir).filter((f) => f.endsWith('.mp4'));
          if (mp4.length === 0) { console.error('渲染产物为空：' + dir + ' 下没有 mp4'); process.exit(1); }
          const f = dir + '/' + mp4[0];
          const size = statSync(f).size;
          if (size <= 0) { console.error('产物是空文件：' + f); process.exit(1); }
          const want = JSON.parse(require('node:fs').readFileSync('examples/minimal/script/timeline.json','utf8')).total_frames;
          const got = Number(execFileSync('ffprobe', ['-v','error','-count_frames','-select_streams','v:0',
            '-show_entries','stream=nb_read_frames','-of','csv=p=0', f], {encoding:'utf8'}).trim());
          console.log(f, size, 'bytes,', got, 'frames');
          if (got !== want) { console.error('帧数不对：产物 ' + got + '，时间轴 ' + want); process.exit(1); }
          "

      # ⚠ 诊断步骤必须在 **job 末尾**：`if: failure()` 只对**它之前**已失败的步骤
      # 生效。放在中间时，后面步骤失败它早已被跳过 —— 实测踩过：诊断步骤显示
      # skipped，真因一个字都拿不到。
      #
      # 现场写成 artifact：未登录时 job 日志正文与 ::error:: annotation 都拿不到
      # （logs API 重定向到登录页），artifact 是唯一可靠的公开通道。
      # 这一步必须永不失败（continue-on-error + 处处 || true）。
      - name: 失败现场（仅失败时跑）
        if: failure()
        continue-on-error: true
        run: |
          {
            echo "== 时间 =="; date
            echo "== 版本 =="; node --version; ffmpeg -version 2>&1 | head -1
            echo "== 渲染确定性（复跑并保留输出）=="
          } > ci-failure.txt 2>&1
          node tools/regression.mjs capture --project examples/minimal --baseline "$(node -e "console.log(require('node:path').join(require('node:os').tmpdir(),'fw-rb.json'))")" >> ci-failure.txt 2>&1 || true
          node tools/regression.mjs verify  --project examples/minimal --baseline "$(node -e "console.log(require('node:path').join(require('node:os').tmpdir(),'fw-rb.json'))")" >> ci-failure.txt 2>&1 || true
          {
            echo "== 静帧直跑（看真因）=="
          } >> ci-failure.txt
          node bin/filmwright.mjs stills --project examples/minimal --frames 30 --dir "$(node -e "console.log(require('node:path').join(require('node:os').tmpdir(),'fw-stills'))")" >> ci-failure.txt 2>&1 || true
          {
            echo "== check --json =="
          } >> ci-failure.txt
          node bin/filmwright.mjs check --project examples/minimal --json >> ci-failure.txt 2>&1 || true
          {
            echo "== .work 产物 =="
          } >> ci-failure.txt
          node -e "const {readdirSync,statSync}=require('node:fs');const d='examples/minimal/.work';try{for(const f of readdirSync(d)){const s=statSync(d+'/'+f);console.log(' ',f,s.isDirectory()?'<dir>':s.size)}}catch(e){console.log(' 读不到',e.message)}" >> ci-failure.txt 2>&1 || true
          echo '--- 现场前 5000 字 ---'
          node -e "console.log(require('node:fs').readFileSync('ci-failure.txt','utf8').slice(0,5000))" || true
          # 同时写进 step summary：它是**公开可读**的（artifact 下载需要认证，
          # job 日志正文也需要认证；summary 不需要），是取出真因的可靠通道。
          {
            echo '## 失败现场'
            echo '```'
            head -c 4000 ci-failure.txt 2>/dev/null || cat ci-failure.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: 上传失败现场
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-${{ runner.os }}
          path: ci-failure.txt
          if-no-files-found: ignore
          retention-days: 14
