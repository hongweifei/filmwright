# CI：两层 × 平台矩阵，失败信息指向明确。
#
#   static  无依赖：单元测试 + 静态自检（不启浏览器）。三个 OS 全跑 ——
#           核心零依赖，这是「跨平台」最便宜也最真的证据。
#   browser 要 Chrome/Edge + ffmpeg：无头渲染验证。跑 ubuntu 与 windows：
#           ubuntu 是 CI 主战场；windows 用预装 Edge（findBrowser 认识它）。
#           macOS 只进 static —— 渲染层在 macOS 上没有本地实测证据，
#           与其配一条猜出来的 job，不如等真机验证过再进矩阵（见 LIMITATIONS）。
#
# 像素回归的边界：基准是**本机夹具**（字体栅格化随 OS/版本变），
# 所以 CI 里做的是「同一次运行内 capture → verify」的确定性自证，
# 跨 OS 的基准比对不做。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: 静态（无依赖）· ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # engines 要求 >=22：驱动浏览器要用全局 WebSocket，Node 20 上没有。
          node-version: '22'
          # 缓存 npm 的下载缓存（`npm ci` 装的是同一份 lockfile ⇒ 命中率很高）。
          # 三个作业各自省 20–40s，代价是缓存本身（GitHub 侧免费额度内）。
          cache: 'npm'

      # 核心命令零依赖；只有 MCP 测试需要 @modelcontextprotocol/sdk。
      # 装依赖让 tests/mcp.test.mjs 不被跳过（没装时它会优雅 skip）。
      # 注意：这个 job **不跑重浏览器测试**（review/stills 要真渲染），
      # 那些在下面的 browser job 里跑（那里本来就有浏览器）。
      - name: 安装依赖（仅 MCP 测试需要）
        run: npm ci

      - name: 单元测试（协议层；重浏览器测试留给 browser job）
        run: npm test

      - name: 静态自检（不启浏览器）
        run: node bin/filmwright.mjs check --project examples/minimal --static-only

      - name: 编码检查（全仓文本必须是合法 UTF-8、无 BOM）
        # 抓肉眼看不见的问题：曾用 PowerShell 的 Add-Content 追加 .gitignore，
        # 它按系统默认编码（GBK）写，中文注释变成非法 UTF-8 —— 而 read 工具
        # 直接拒绝读取，才知道出事了。这类问题必须在 CI 上自动拦住。
        run: node tools/verify-encoding.mjs

      # 发布物：npm 包里不许混进本机的东西。两件实测事故，`git status` 当时都干净：
      #   ① `src/host/tts/__pycache__/*.pyc` —— 跑过一次 Python 就有，而 `files: ["src"]`
      #      是目录白名单，它正好在白名单里；
      #   ② `docs/design/*.md`（本地草稿、未跟踪）—— `files: ["docs"]` 会把它发到 registry。
      # 共同点：**「未跟踪」不等于「不会发布」**。git 忽略它，npm 照收。
      - name: 发布物（npm 包不许含本机草稿 / 字节码）
        run: node tools/verify-package.mjs

      - name: 文档与实现一致（模板数 / 自检道数 / 事实性说法）
        # 曾发现 26 处脱节：文档说「视频没有内建支持」而 clips 已实现、
        # 说「13 类模板」而实际 15 类、自检道数在七/八/九之间混用。
        # 数字从实现里读，文档跟不上就让 CI 红。
        run: node tools/verify-docs.mjs

      # 死导出守卫（棘轮）：盘点时发现 src/ 的 376 个导出里有 3 个没人用。
      # "没人用"不等于"该删"（可能是给使用者的公开 API），所以不做一刀切：
      # 当前状态记录在名单里，**新出现**死导出就红；名单里已被清理的也红（防名单腐烂）。
      - name: 死导出（棘轮：新增死导出 / 名单陈旧 都算错）
        run: node tools/dead-exports.mjs

      # 文档内部链接：所有 `](相对路径)` 都要指向存在的文件。
      # 这类东西最容易悄悄腐烂 —— 文件改名/移动后链接不会报错，只会 404，
      # 而 `verify-docs` 核数字与事实性说法、核不到链接。
      - name: 文档内部链接（改文件名时最容易漏）
        run: node tools/verify-links.mjs

      # 「同一个根因换个位置又回来」的两类，各让 CI 红过一次以上：
      #   ① CI 不带参数跑工具，而工具写着 resolve(process.argv[2]) → 抛 ERR_INVALID_ARG_TYPE；
      #   ② existsSync 为真 ≠ 能读（Windows 上别的进程持有句柄 → EBUSY）。
      # ② 用棘轮：当前在册的那些读的是用户项目文件（非跨进程写），记录在案；
      #    新出现必须审一遍属于哪一类。
      - name: 调用安全（CI 无参调用 / 存在就直读）
        run: node tools/verify-invocation.mjs

  # README 路径单独一个作业。
  # 为什么还要再拆：拆出 `browser-slow` 之后，**瓶颈变成了它自己**（约 8 分钟，
  # 而 `browser` 只有约 5.5 分钟）—— 在非瓶颈作业里做优化**对墙钟一点用没有**。
  # 把 148s 的 `verify-readme` 挪出来，三个作业的负载变成约 337s / 330s / 208s，
  # 墙钟由最慢的 337s 决定：**约 8.1 分钟 → 约 5.6 分钟**。
  # ⚠️ 这几个负载数字是**拆作业那一次**的实测；其后 `verify-longform` 瘦身、
  # `verify-comp` / `verify-complex` 并入 `verify-composite`，负载已经变了 ——
  # 当前各作业跑哪些工具、逐项耗时见 `docs/qc.md` 的「哪些验收工具会自动跑」表。
  browser-doc:
    name: 渲染·文档路径（README 快速开始要真的走通）· ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖（MCP 重浏览器测试需要）
        run: npm ci

      - name: 安装 ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 安装 ffmpeg（choco）
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: 确认环境（浏览器 / ffmpeg，缺失即失败）
        run: |
          set -euo pipefail
          node -e "import('./src/host/browser/find.mjs').then((m) => console.log('浏览器：' + m.findBrowser()))"
          command -v ffmpeg >/dev/null || { echo 'ffmpeg 不在 PATH'; exit 1; }

      # README 承诺的入门路径要**真的走通**（含全新 clone：没有 audio/ 也要出片到 renders/）
      - name: README 快速开始路径（文档承诺要真的走通）
        run: node tools/verify-readme.mjs

  # 「慢」作业：把最费时的验收拆出来单独跑。
  # 为什么拆：`browser` 里那十几个 `verify-*` 是**串行**的（拆之前那批步骤约 13 分钟），
  # 而 GitHub 给每个 job 一个独立 runner —— 拆开就是**真并行**，
  # 墙钟从「最慢那条腿」≈13 分钟降到 max(快组, 慢组) ≈ 8 分钟。
  # 代价是多两个 runner；覆盖率**一点没少**（同一批工具、同一批 OS）。
  browser-slow:
    name: 渲染·慢（长片）· ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖（MCP 重浏览器测试需要）
        run: npm ci

      - name: 安装 ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 安装 ffmpeg（choco）
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: 确认环境（浏览器 / ffmpeg，缺失即失败）
        run: |
          set -euo pipefail
          node -e "import('./src/host/browser/find.mjs').then((m) => console.log('浏览器：' + m.findBrowser()))"
          command -v ffmpeg >/dev/null || { echo 'ffmpeg 不在 PATH'; exit 1; }

      # 长片：单实例跑几千帧会不会退化（同一次运行内**头段 vs 尾段**的配对比较）。
      # 默认 18000 帧（10 分钟量级）跑不完 CI；`--frames 1200 --no-big` 保留这条判据，
      # 耗时约为大规格的一半（`--no-big` 还会跳过那一次全分辨率大渲染）。
      # ⚠️ 分片加速比与内存**只报数不判定**，`--no-big` 下更是整段跳过 ⇒ 自动跑时
      # 唯一起作用的判据是「单实例不退化」；段缓存那节已删（由 incremental / attribution 守）。
      - name: 长片（单实例长跑不退化：同一次运行内头尾段配对）
        run: node tools/verify-longform.mjs --frames 1200 --no-big

      # ⚠️ README 路径这一步**已移到 `browser-doc` 作业** —— 它是这个作业里第二费时的一项，
      # 而拆出 `browser-slow` 之后瓶颈正是本作业。别再加回来（加了就是重复跑）。
      #
      # ⚠️ 「改一个镜头只重渲覆盖它的段」（`verify-attribution`）**已随声明式一起删掉**：
      # 那条判据靠的是 scene.json 的**逐镜头**指纹，而镜头现在全在一个 `shots/index.js` 里，
      # 只能整文件当全局指纹 ⇒ 改任何一个镜头都会让所有段失效（见 docs/qc.md）。
      # 仍然成立的那部分（复用段与重渲逐帧一致 / 同输入第二跑**一段都不重渲** /
      # 改文件→画面变→改回→回到基线 / 引擎源码变→全失效）由 `verify-incremental` 守，
      # 在 `browser` 作业里 —— 「复用真的发生了」这条计数断言也一并搬到了那里。

  browser:
    name: 渲染（无头浏览器 + ffmpeg）· ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖（MCP 重浏览器测试需要）
        run: npm ci

      # ubuntu-latest 不自带 ffmpeg（实测 ENOENT）；windows 用 choco 补。
      - name: 安装 ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 安装 ffmpeg（choco）
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      # 真断言：findBrowser() 是渲染实际走的那条查找路径，它抛错才算缺；
      # pipefail 让 `ffmpeg -version | head` 不再假绿（管道退出码取 head 的 0）。
      - name: 确认环境（浏览器 / ffmpeg，缺失即失败）
        run: |
          set -euo pipefail
          node -e "import('./src/host/browser/find.mjs').then((m) => console.log('浏览器：' + m.findBrowser()))"
          command -v ffmpeg >/dev/null || { echo 'ffmpeg 不在 PATH'; exit 1; }
          command -v ffprobe >/dev/null || { echo 'ffprobe 不在 PATH'; exit 1; }
          ffmpeg -version | head -1

      - name: 逐帧 + 画质自检
        run: node bin/filmwright.mjs check --project examples/minimal

      # 重浏览器测试（MCP 的 stills/review 要真渲染）：static job 里跳过、
      # 这里跑 —— 这个 job 本来就有浏览器与 ffmpeg。
      #
      # 显式用 bash：windows runner 的默认 shell 是 PowerShell，行为与 ubuntu 不同
      # （实测该步骤在 windows 上 0 秒失败、而本机同命令通过 —— 环境/shell 差异）。
      # 与 job 级 defaults 一致地走 bash，消除这一层变量；`set -x` 让命令可见。
      - name: MCP 重浏览器测试（stills / review 回图）
        shell: bash
        env:
          FILMWRIGHT_TEST_BROWSER: '1'
        run: |
          set -x
          node --version
          node --test tests/mcp.test.mjs

      # 画质/逐帧是「阈值型 + 浏览器型」检查：读数贴阈值或 runner 资源紧张时
      # 会随机翻面（实测 windows runner 上不同步骤轮流挂，代码未变）。
      # ⚠️ 「五个示例各自 `check --static-only`」这一步**已删**：那五个示例
      # （scenecast / gallery / three / promo / vertical）都是 scene.json 驱动的，
      # 已随声明式一起删掉；唯一剩下的 `examples/minimal` 由上面那一步（全量 `check`）
      # 覆盖，这里再跑一遍 static-only 只是重复。

      # 渲染确定性：同一次运行内 capture → verify，证明「两轮渲染逐字节相同」。
      #
      # 基准写到**临时路径**：入库的 regression-baseline.json 是**本机夹具**
      # （字体栅格化随 OS/浏览器版本变），CI 覆盖它只会制造脏工作区，
      # 而且跨 OS 比对本来就不成立（见 docs/qc.md）。
      - name: 渲染确定性（同运行内 capture → verify，两轮渲染逐字节相同）
        run: |
          BASE=$(node -e "console.log(require('node:path').join(require('node:os').tmpdir(),'fw-regression-baseline.json'))")
          echo "基准：$BASE"
          node tools/regression.mjs capture --project examples/minimal --baseline "$BASE"
          node tools/regression.mjs verify  --project examples/minimal --baseline "$BASE"

      - name: 负面对照（证明画质检查真的会报）
        run: node tools/quality-negative.mjs

      - name: 素材（加载就绪 / 真画出来 / 引错名字要报）
        run: node tools/verify-assets.mjs

      # 效果链与命令式入口：这两个能力**最新**，也最容易悄悄退化，
      # 所以必须自动跑。实测耗时（无 GPU、软件 WebGL）：effects 约 64s、imperative 约 20s。
      #
      # 刻意**不加 `--gpu`**：CI runner 拿不到可靠的 GPU，而且默认档（软件 WebGL）
      # 正是要守住"确定性"的那一档 —— 效果在这档下也必须正确。
      - name: 效果链（往返保真 / 各效果的量化判据 / 直通帧逐位相同）
        run: node tools/verify-effects.mjs

      - name: 命令式入口（与声明式同能力 / 写错当场报）
        run: node tools/verify-imperative.mjs

      # ── 下面这批曾经**从不自动运行**（当时 21 个验收工具里只有 7 个进了 CI）──
      # 注意：**不要**给这些命令加 `.` 参数。工具默认的根就是仓库根（绝对路径），
      # 而有些工具会用它拼 `pathToFileURL(`${ROOT}/…`)` —— 传相对路径会抛
      # ERR_INVALID_FILE_URL_PATH。曾经因为加了 `.` 导致 6 个工具在 CI 里失败。
      # 逐个量过耗时，只把快的接进来（最慢 41s，那批合计约 100s）：
      #   mix 1.7s / clips 1.9s / clip-render 2.3s / reuse 5.0s /
      #   incremental 38.8s / determinism 41.3s
      # 慢的各自拆成专用作业（readme 148s → `browser-doc`；longform → `browser-slow`）；
      # tts / voiceover 要联网或真配音产物，仍在手动跑。见 docs/qc.md 里那张"哪些在跑"的表。
      #
      # ⚠️ 工具数会漂：`verify-comp` / `verify-complex` / `verify-composite` / `verify-reveal` /
      # `verify-attribution` / `dogfood-review` 都已删（对象随声明式一起消失）。
      #
      # **这里刻意不写具体数字**：`verify-docs` 核的是 `README.md` 与 `docs/qc.md` 里那两个
      # 计数，**ci.yml 不在它的扫描范围里** —— 这行原来写着「24 个验收工具里 22 个自动跑，
      # 这个计数由 verify-docs 核」，实测早已是 25 / 23，而没有任何守卫会红（那句「由守卫核」
      # 是假的）。数字要看去那两个文件；**在不受守卫管的注释里复述数字，必然腐烂**。
      #
      # 接进来之后**立刻**抓到两个一直在失败的守卫（详见 docs/qc.md）：
      #   · verify-readme 里硬编码 `schema 类型数 !== 13`，而类型已涨到 18（该判据随
      #     声明式一起删了 —— `schema` 命令本身已不存在）
      # 那条改成**从实现里推导期望**，不再硬编码数字。
      - name: 配乐混音（真跑混音，并直接测音乐那一路）
        run: node tools/verify-mix.mjs

      - name: 素材管线（host 侧：抽帧 / 缓存命中 / 断点安全）
        run: node tools/verify-clips.mjs

      - name: 片段在浏览器里真取到并画出
        run: node tools/verify-clip-render.mjs

      - name: 可复用性（换分辨率 / 换浏览器）
        run: node tools/verify-reuse.mjs

      # D 节是父子绑定（`follow`）与空物体（`empty`）：量**方向 / 单调 / 逐字节等价**，
      # 负面对照是「去掉 `follow`（绑定失效）⇒ 同一个谓词判红」—— 不是「画面变了」那种恒真说法。
      # 遮罩（阶段 ③）：四种形状 + 反选都要**确实改变画面**、五种输出互不相同
      # （不是同一个路径换名字）、同一遮罩两次渲染逐字节一致。
      - name: 遮罩（四种形状 / 反选 / 可复现）
        run: node tools/verify-mask.mjs

      - name: 增量重渲的安全性（复用段必须与重渲逐帧一致）
        run: node tools/verify-incremental.mjs

      - name: 捕获确定性（多轮渲染同一区间逐字节一致）
        run: node tools/verify-determinism.mjs

      # ⚠️ 两个「慢但守核心契约」的验收**已各自拆到专用作业**（公开仓库的 CI 不花钱、
      # 只花墙上时间，所以它们没有被留在手动跑）：
      #   · `verify-readme`（148s）→ `browser-doc`：走一遍文档承诺的快速开始
      # 3D 图层（three 是 **devDependency**，`npm ci` 已经装好了；运行时它仍是可选依赖）。
      # 这条路径以前完全没有自动守卫 —— 改 src/runtime/three/ 或 importmap / vendor 路由
      # 没人拦。它验的是：3D 内容真的叠进帧里、同一帧两次渲染逐字节一致、
      # 跳帧与连渲一致、光照真的参与着色（只有环境光时物体应当是"平"的）。
      # （原先还有一条「不用 3D 的规格不会去加载 three」——那条随声明式 3D 的
      #  `needsThree()` 一起删了：命令式 3D 由镜头模块自己 `await loadThree()`，加载与否由用户决定。）
      - name: 3D 图层（内容入帧 / 确定性 / 光照真的生效）
        run: node tools/verify-three.mjs

      # 页面侧 H.264 编码器（WebCodecs）：性能方向的地基。
      # 判据不止"没报错"—— 要用 ffprobe 证明**产出的是一段有效视频**、帧数对得上、
      # 背压生效（队列不超上限）、并报出实际用的编码配置。
      - name: H.264 编码器（WebCodecs：有效视频 / 帧数一致 / 背压 / 报出编码配置）
        run: node tools/verify-h264.mjs

      # ⚠️ 长片与按段归因**已移到 `browser-slow` 作业**、README 路径**已移到 `browser-doc`**
      # —— 它们是串行耗时的大头；拆出去才能真并行。
      # 别把它们再加回来（加了就是重复跑）。

      - name: 预览页（拖动 / 播放 / 热重载）
        run: node tools/verify-preview.mjs

      # `--shards auto` 按核数定分片：windows runner 只有 2 核，硬写 2 片会超订
      # （2 个无头 Chrome + 2 个 ffmpeg 抢 2 核，实测端到端出片跑 109s 后失败）。
      # ubuntu runner 核多，自动会开更多片 —— 这正是 --shards auto 的用途。
      - name: 端到端出片
        run: node bin/filmwright.mjs render --project examples/minimal --shards auto

      # 用 node 取产物、判非空，不用 `ls | head -1`：
      # Git Bash 的 ls 是多列输出，`head -1` 会截出多个文件名的片段，
      # test -s 拿到一个不存在的路径就失败（windows job 实测挂在这一步）。
      # 顺带用 ffprobe 验帧数，比「文件非空」更硬。
      - name: 产物检查（非空 + 帧数对得上）
        run: |
          node -e "
          const {readdirSync, statSync} = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const dir = 'examples/minimal/.work';
          const mp4 = readdirSync(dir).filter((f) => f.endsWith('.mp4'));
          if (mp4.length === 0) { console.error('渲染产物为空：' + dir + ' 下没有 mp4'); process.exit(1); }
          const f = dir + '/' + mp4[0];
          const size = statSync(f).size;
          if (size <= 0) { console.error('产物是空文件：' + f); process.exit(1); }
          const want = JSON.parse(require('node:fs').readFileSync('examples/minimal/script/timeline.json','utf8')).total_frames;
          // ⚠️ **别直接 Number(ffprobe 输出)** —— `-of csv` 的输出**随 ffprobe 版本变**：
          // ubuntu 的 6.1.1 给 `1596`，而 windows runner 上的版本给 **`1596,`（带尾随逗号）**，
          // `Number('1596,')` 是 **NaN**，于是 windows job 报「产物 NaN」而 ubuntu 通过。
          // 改成**取输出里第一个整数**，对两种格式都成立。
          const raw = execFileSync('ffprobe', ['-v','error','-count_frames','-select_streams','v:0',
            '-show_entries','stream=nb_read_frames','-of','csv=p=0', f], {encoding:'utf8'});
          const m = /(\d+)/.exec(raw);
          const got = m ? Number(m[1]) : NaN;
          console.log(f, size, 'bytes,', got, 'frames', '(ffprobe 原文 ' + JSON.stringify(raw.trim()) + ')');
          if (got !== want) { console.error('帧数不对：产物 ' + got + '，时间轴 ' + want); process.exit(1); }
          "

      # ⚠ 诊断步骤必须在 **job 末尾**：`if: failure()` 只对**它之前**已失败的步骤
      # 生效。放在中间时，后面步骤失败它早已被跳过 —— 实测踩过：诊断步骤显示
      # skipped，真因一个字都拿不到。
      #
      # 现场写成 artifact：未登录时 job 日志正文与 ::error:: annotation 都拿不到
      # （logs API 重定向到登录页），artifact 是唯一可靠的公开通道。
      # 这一步必须永不失败（continue-on-error + 处处 || true）。
      - name: 失败现场（仅失败时跑）
        if: failure()
        continue-on-error: true
        run: |
          {
            echo "== 时间 =="; date
            echo "== 版本 =="; node --version; ffmpeg -version 2>&1 | head -1
            echo "== 渲染确定性（复跑并保留输出）=="
          } > ci-failure.txt 2>&1
          node tools/regression.mjs capture --project examples/minimal --baseline "$(node -e "console.log(require('node:path').join(require('node:os').tmpdir(),'fw-rb.json'))")" >> ci-failure.txt 2>&1 || true
          node tools/regression.mjs verify  --project examples/minimal --baseline "$(node -e "console.log(require('node:path').join(require('node:os').tmpdir(),'fw-rb.json'))")" >> ci-failure.txt 2>&1 || true
          {
            echo "== 静帧直跑（看真因）=="
          } >> ci-failure.txt
          node bin/filmwright.mjs stills --project examples/minimal --frames 30 --dir "$(node -e "console.log(require('node:path').join(require('node:os').tmpdir(),'fw-stills'))")" >> ci-failure.txt 2>&1 || true
          {
            echo "== check --json =="
          } >> ci-failure.txt
          node bin/filmwright.mjs check --project examples/minimal --json >> ci-failure.txt 2>&1 || true
          {
            echo "== .work 产物 =="
          } >> ci-failure.txt
          node -e "const {readdirSync,statSync}=require('node:fs');const d='examples/minimal/.work';try{for(const f of readdirSync(d)){const s=statSync(d+'/'+f);console.log(' ',f,s.isDirectory()?'<dir>':s.size)}}catch(e){console.log(' 读不到',e.message)}" >> ci-failure.txt 2>&1 || true
          echo '--- 现场前 5000 字 ---'
          node -e "console.log(require('node:fs').readFileSync('ci-failure.txt','utf8').slice(0,5000))" || true
          # 同时写进 step summary：它是**公开可读**的（artifact 下载需要认证，
          # job 日志正文也需要认证；summary 不需要），是取出真因的可靠通道。
          {
            echo '## 失败现场'
            echo '```'
            head -c 4000 ci-failure.txt 2>/dev/null || cat ci-failure.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: 上传失败现场
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-${{ runner.os }}
          path: ci-failure.txt
          if-no-files-found: ignore
          retention-days: 14
